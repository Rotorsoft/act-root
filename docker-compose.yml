services:
  postgres:
    container_name: act-pg
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      # Postgres 18+ images keep data in a versioned subdirectory
      # (/var/lib/postgresql/18/docker) and refuse a mount at the old
      # .../data path, so mount the parent. A fresh host directory, since
      # 17's data files can't be opened by 18.
      - .postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5431:5432"

  # Second Postgres, benchmarks only (#1510). A hybrid store puts the
  # subscription half on its own instance, and measuring that honestly needs a
  # real second server — a second database on the same server would share a
  # WAL and a checkpointer, hiding both the benefit and the extra network hop
  # the split actually costs. Not used by the test suite; `docker compose up
  # postgres` still starts only the primary.
  postgres-subs:
    container_name: act-pg-subs
    image: postgres:18-alpine
    restart: always
    profiles: ["bench"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
