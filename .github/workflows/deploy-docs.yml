name: Deploy Docusaurus Docs

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docs:
              - 'libs/*/src/**'
              - 'docs/**'
    outputs:
      docs: ${{ steps.filter.outputs.docs }}

  deploy:
    needs: filter
    if: needs.filter.outputs.docs == 'true'
    runs-on: ubuntu-latest
    # Pages rejects a deployment while another is in flight, so back-to-back
    # pushes queue here instead of failing. Only the newest waiting run is kept.
    concurrency:
      group: pages
      cancel-in-progress: false
    # Deploy straight from this workflow via actions/deploy-pages instead of
    # pushing a gh-pages branch for GitHub's internal (unretryable,
    # unconfigurable) pages-build-deployment workflow to pick up. The double
    # hop wedged twice on backend transients; this path has no second hop.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: "pnpm"

      - run: pnpm install
      - run: pnpm -F docs build:all

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
