name: Perf Baseline

# Run by hand: regenerates the adapter perf baselines on a CI runner, so the
# weekly perf gate (conformance.yml) compares like-for-like hardware. Commit the artifact's
# perf-baseline.json files.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SKIP_SIMPLE_GIT_HOOKS: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5431:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm -F @rotorsoft/act-pg bench:update
      - run: pnpm -F @rotorsoft/act-sqlite bench:update
      - uses: actions/upload-artifact@v7
        with:
          name: perf-baselines
          path: |
            libs/act-pg/perf-baseline.json
            libs/act-sqlite/perf-baseline.json
          if-no-files-found: error
