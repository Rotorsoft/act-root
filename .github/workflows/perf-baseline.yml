name: Perf Baseline

# Run by hand: regenerates the adapter perf baselines on a CI runner, so the
# weekly perf gate (conformance.yml) compares like-for-like hardware. Commit the artifact's
# perf-baseline.json files.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SKIP_SIMPLE_GIT_HOOKS: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5431:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm -F @rotorsoft/act-pg bench:update
      - run: pnpm -F @rotorsoft/act-sqlite bench:update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-baselines
          path: |
            libs/act-pg/perf-baseline.json
            libs/act-sqlite/perf-baseline.json
          if-no-files-found: error
