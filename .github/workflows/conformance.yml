name: Store Conformance Matrix

# Weekly: the Store TCK on every supported backend version, the older Node
# lines, the perf gates, the scenario benches and the multi-process stress
# harness. ci-cd.yml covers PG 18 and the pinned libSQL on every PR.
# Informational: a red cell means a version slipped.

on:
  schedule:
    # Sundays at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  SKIP_SIMPLE_GIT_HOOKS: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pg:
    name: pg-${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 14 is the oldest security-patched line; ci-cd.yml covers 18.
        pg: ["14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5431:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: "pnpm"
      - run: pnpm install
      # From the repo root: the root vite config aliases `@rotorsoft/*` to
      # source, and these jobs never build.
      - name: Run TCK against PostgreSQL ${{ matrix.pg }}
        run: pnpm vitest run libs/act-pg/test/store-tck.spec.ts
      # act-notify runs the Store TCK over withBroker(PostgresStore).
      - name: Run act-notify TCK against PostgreSQL ${{ matrix.pg }}
        run: pnpm vitest run libs/act-notify/test/store-tck.spec.ts

  sqlite:
    # Does the next libSQL release break us? ci-cd.yml tests the pinned one.
    name: libsql-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: "pnpm"

      - name: Override @libsql/client to latest
        # `pnpm.overrides` swaps the version for this job only.
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.pnpm = pkg.pnpm ?? {};
            pkg.pnpm.overrides = pkg.pnpm.overrides ?? {};
            pkg.pnpm.overrides["@libsql/client"] = "latest";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          cat package.json | grep -A 3 '"pnpm"' || true

      - run: pnpm install --no-frozen-lockfile
      - name: Print resolved @libsql/client version
        run: pnpm list --filter @rotorsoft/act-sqlite @libsql/client --depth 0
      - name: Run TCK against the latest libSQL
        run: pnpm vitest run libs/act-sqlite/test/store-tck.spec.ts

  # Multi-process Postgres stress harness; reports to the Job Summary.
  stress:
    runs-on: ubuntu-latest
    # Postgres 18 for every job below that needs one (YAML anchor).
    services: &pg18
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5431:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: "pnpm"

      - run: pnpm install
      # Workers import the packages by name, so build them.
      - run: pnpm -F @rotorsoft/act-patch build
      - run: pnpm -F @rotorsoft/act build
      - run: pnpm -F @rotorsoft/act-pg build

      - name: Run stress suite
        env:
          NODE_ENV: test
          LOG_LEVEL: fatal
        run: pnpm -F @rotorsoft/act-pg stress | tee stress-report.md

      - name: Post report to Job Summary
        if: always()
        run: cat stress-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-report
          path: stress-report.md

  # Proves the engines floor (Node >=22.23.3) and 24 still pass; CI runs 26.
  node-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.3", "24.21.0"]
    services: *pg18
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # Per-adapter perf gate on real adapters (Postgres on 5431, on-disk SQLite).
  # Budgets: p50 ≤ 2.0× baseline for act-pg, ≤ 1.5× for act-sqlite, skipped
  # below a 1.0 ms baseline (see each perf-check.ts). Baselines come from
  # perf-baseline.yml. A noisy scenario gets a fresh baseline or a wider
  # budget, never a silenced gate.
  perf:
    runs-on: ubuntu-latest
    services: *pg18
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: "pnpm"
      - run: pnpm install
      # The bench scripts import `@rotorsoft/act` from its built dist/.
      - run: pnpm build
      - name: act-pg perf gate
        run: |
          set -o pipefail
          pnpm -F @rotorsoft/act-pg bench:run
          pnpm -F @rotorsoft/act-pg bench:check 2>&1 | tee bench-pg.log
      - name: act-sqlite perf gate
        # Runs even when the pg gate fails, so one breach doesn't hide the other.
        if: always()
        run: |
          set -o pipefail
          pnpm -F @rotorsoft/act-sqlite bench:run
          pnpm -F @rotorsoft/act-sqlite bench:check 2>&1 | tee bench-sqlite.log
      - name: Append adapter perf results to step summary
        if: always()
        run: |
          {
            echo "## Adapter perf gate"
            echo ""
            echo "Real-adapter p50 regression budgets — act-pg 2.0×, act-sqlite"
            echo "1.5×, both with a 1.0 ms absolute floor. A breach fails the job."
            echo ""
            echo "### act-pg"
            echo '```'
            sed -E $'s/\x1b\\[[0-9;]*m//g' bench-pg.log 2>/dev/null || echo "(no act-pg output)"
            echo '```'
            echo "### act-sqlite"
            echo '```'
            sed -E $'s/\x1b\\[[0-9;]*m//g' bench-sqlite.log 2>/dev/null || echo "(no act-sqlite output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Scenario benchmarks, each with a built-in regression bound, on Postgres.
  scenarios:
    runs-on: ubuntu-latest
    services: *pg18
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: "pnpm"
      - run: pnpm install
      # Runners intermittently stall WAL flushes for ~100 ms, which failed the
      # notify bench on good code. These benches measure wake-up latency, not
      # disk, so this throwaway database commits async; the perf job keeps the
      # default its baselines assume.
      - name: Postgres without synchronous commit (benches only)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5431 -U postgres -c "ALTER SYSTEM SET synchronous_commit = off"
          psql -h localhost -p 5431 -U postgres -c "SELECT pg_reload_conf()"
          psql -h localhost -p 5431 -U postgres -tc "SHOW synchronous_commit"
      # The captured tables go to the step summary.
      - name: bench:scenarios
        env:
          # Node emits ANSI color even when piped; it garbles the summary.
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          pnpm bench:scenarios 2>&1 | tee bench-scenarios.log
      - name: Append scenario bench results to step summary
        if: always()
        run: |
          {
            echo "## Scenario benchmark results"
            echo ""
            echo '```'
            # Keep the `=== header ===` + console.table blocks; sed strips stray ANSI.
            if grep -qE '=== .+ ===' bench-scenarios.log 2>/dev/null; then
              awk '
                /=== .+ ===/    { printing=1 }
                printing        { print }
                /└/ && printing { printing=0; print "" }
              ' bench-scenarios.log \
              | sed -E $'s/\x1b\\[[0-9;]*m//g'
            else
              tail -n 80 bench-scenarios.log
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
