name: Store Conformance Matrix

# Weekly (and on demand): the Store TCK against every supported backend
# version, the full suite on the older supported Node lines, the adapter
# perf gates, the scenario benchmarks, plus the multi-process Postgres
# stress harness. Catches
# dialect-specific regressions (PG SKIP LOCKED behavior across majors,
# libSQL release bumps) and lease/commit/drain races that single-process
# tests cannot. ci-cd.yml already runs the full TCK against PG 18 and the
# pinned libSQL on every PR, so this runs on a schedule rather than per PR.
#
# Informational, not required for branch protection. A red cell signals
# "this version slipped" — author owns the call to revert, pin, or
# document the loss of support.

on:
  schedule:
    # Sundays at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  SKIP_SIMPLE_GIT_HOOKS: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pg:
    name: pg-${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PostgreSQL 13 went EOL 2025-11. 14 is the oldest still
        # security-patched line. 18 is left out: `ci-cd.yml` already runs
        # the full TCK against it.
        pg: ["14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5431:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: "pnpm"
      - run: pnpm install
      # Run from the repo root, not `pnpm -F <pkg> exec vitest`: the root
      # vite config aliases `@rotorsoft/*` to each package's SOURCE, and
      # these jobs never build. From inside a package that alias is not
      # applied, so vitest falls back to act-tck's `exports`, which point
      # at a `dist/` that does not exist here.
      - name: Run TCK against PostgreSQL ${{ matrix.pg }}
        run: pnpm vitest run libs/act-pg/test/store-tck.spec.ts
      # act-notify runs the full Store TCK over withBroker(PostgresStore),
      # so a with-broker.ts change gets the same multi-version PG coverage
      # as the base adapter (its correctness rides on PG semantics).
      - name: Run act-notify TCK against PostgreSQL ${{ matrix.pg }}
        run: pnpm vitest run libs/act-notify/test/store-tck.spec.ts

  sqlite:
    # Answers "does the next libSQL release break us before we adopt it."
    # The pinned version is what `ci-cd.yml` already tests.
    name: libsql-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: "pnpm"

      - name: Override @libsql/client to latest
        # `pnpm.overrides` survives `pnpm install` and is the idiomatic
        # way to swap a transitive version in a workspace. Writing into
        # the root package.json keeps the change scoped to this job.
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.pnpm = pkg.pnpm ?? {};
            pkg.pnpm.overrides = pkg.pnpm.overrides ?? {};
            pkg.pnpm.overrides["@libsql/client"] = "latest";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          cat package.json | grep -A 3 '"pnpm"' || true

      - run: pnpm install --no-frozen-lockfile
      - name: Print resolved @libsql/client version
        run: pnpm list --filter @rotorsoft/act-sqlite @libsql/client --depth 0
      - name: Run TCK against the latest libSQL
        run: pnpm vitest run libs/act-sqlite/test/store-tck.spec.ts

  # Multi-process Postgres stress harness: real concurrency, real PG, real
  # workers. Reports to the run's Job Summary.
  stress:
    runs-on: ubuntu-latest
    # Postgres 18 for every job below that needs one (YAML anchor).
    services: &pg18
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5431:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: "pnpm"

      - run: pnpm install
      # Workers import `@rotorsoft/act` and `@rotorsoft/act-pg` via the
      # workspace symlinks; build them so the published-shape resolution
      # works (PostgresStore imports `@rotorsoft/act` by package name).
      - run: pnpm -F @rotorsoft/act-patch build
      - run: pnpm -F @rotorsoft/act build
      - run: pnpm -F @rotorsoft/act-pg build

      - name: Run stress suite
        env:
          NODE_ENV: test
          LOG_LEVEL: fatal
        run: pnpm -F @rotorsoft/act-pg stress | tee stress-report.md

      - name: Post report to Job Summary
        if: always()
        run: cat stress-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-report
          path: stress-report.md

  # The libraries' engines floor is Node >=22.23.3, while CI, docs and the
  # perf image run on 26. This proves every supported release line still
  # passes, so the floor is a fact rather than a promise. Weekly rather than
  # per PR: typecheck already pins the floor's API (`@types/node`), and in
  # 100 per-PR runs this caught nothing the Node 26 job missed.
  node-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.3", "24.21.0"]
    services: *pg18
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # Per-adapter perf gate on REAL adapters: the docker Postgres on 5431 and a
  # real on-disk SQLite, the only place adapter-level regressions (a lost
  # index, a reintroduced N+1, a snapshot-floor read that scans the whole
  # stream) actually surface. Weekly, like every benchmark: PR merges gate
  # on functionality and compatibility, and benchmarks keep their own pace.
  #
  # Budgets: p50 ≤ 2.0× baseline for act-pg (wide noise band on a real
  # DB), p50 ≤ 1.5× for act-sqlite (embedded, tighter). Both skip the
  # ratio check when the baseline p50 is below a 1.0 ms absolute floor
  # (sub-ms ops are noise-dominated). See each package's perf-check.ts.
  #
  # A budget breach fails this job. Baselines come from a CI runner
  # (perf-baseline.yml), so they match the hardware the gate runs on, and
  # the 2.0×/1.5× tolerances + the 1.0 ms floor absorb run-to-run variance.
  # If a scenario proves noisy, refresh the baseline (re-run
  # perf-baseline.yml) or widen its budget — don't silence the gate. The pg
  # connection needs no extra env: PostgresStore defaults
  # (host/db/user/password = postgres) match the docker service.
  perf:
    runs-on: ubuntu-latest
    services: *pg18
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: "pnpm"
      - run: pnpm install
      # The bench scripts import `@rotorsoft/act` by package name, which
      # resolves to its built `dist/`.
      - run: pnpm build
      - name: act-pg perf gate
        run: |
          set -o pipefail
          pnpm -F @rotorsoft/act-pg bench:run
          pnpm -F @rotorsoft/act-pg bench:check 2>&1 | tee bench-pg.log
      - name: act-sqlite perf gate
        # Runs even when the pg gate fails, so one breach doesn't hide the other.
        if: always()
        run: |
          set -o pipefail
          pnpm -F @rotorsoft/act-sqlite bench:run
          pnpm -F @rotorsoft/act-sqlite bench:check 2>&1 | tee bench-sqlite.log
      - name: Append adapter perf results to step summary
        if: always()
        run: |
          {
            echo "## Adapter perf gate"
            echo ""
            echo "Real-adapter p50 regression budgets — act-pg 2.0×, act-sqlite"
            echo "1.5×, both with a 1.0 ms absolute floor. A breach fails the job."
            echo ""
            echo "### act-pg"
            echo '```'
            sed -E $'s/\x1b\\[[0-9;]*m//g' bench-pg.log 2>/dev/null || echo "(no act-pg output)"
            echo '```'
            echo "### act-sqlite"
            echo '```'
            sed -E $'s/\x1b\\[[0-9;]*m//g' bench-sqlite.log 2>/dev/null || echo "(no act-sqlite output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Scenario benchmarks, each with a built-in regression bound. Weekly
  # rather than per PR: in about 70 per-PR runs they caught no regression,
  # and they were the slowest job on a core PR. They run on the real
  # Postgres adapter, so this job needs the same service.
  scenarios:
    runs-on: ubuntu-latest
    services: *pg18
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: "pnpm"
      - run: pnpm install
      # The scenario benches measure wake-up and reaction latency, not the
      # runner's disk. GitHub runners intermittently stall WAL flushes for
      # ~100 ms, which turned every write (mark, lease, ack) into a stall and
      # failed the notify bench on the same code that passes the next run.
      # Async commit takes the flush off the request path for this throwaway
      # database only; the perf job keeps the default its baselines assume.
      - name: Postgres without synchronous commit (benches only)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5431 -U postgres -c "ALTER SYSTEM SET synchronous_commit = off"
          psql -h localhost -p 5431 -U postgres -c "SELECT pg_reload_conf()"
          psql -h localhost -p 5431 -U postgres -tc "SHOW synchronous_commit"
      # Scenario benchmarks (Shape C). Each one has a built-in
      # regression assertion, so a real perf regression breaks the
      # build. The captured stdout ends up in the workflow's step
      # summary so reviewers see the numbers without scrolling logs.
      - name: bench:scenarios
        env:
          # vitest/node emit ANSI color codes even when stdout is piped,
          # which renders as `␛[32m'…'␛[39m` garbage inside the markdown
          # code block we append to the step summary. NO_COLOR disables
          # color emission at the Node level.
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          pnpm bench:scenarios 2>&1 | tee bench-scenarios.log
      - name: Append scenario bench results to step summary
        if: always()
        run: |
          {
            echo "## Scenario benchmark results"
            echo ""
            echo '```'
            # Extract the console.table blocks from the captured run.
            # Scenario benches print `=== <header> ===` then the table;
            # the closing `└` line is the bottom corner of the table.
            # Single-process vitest keeps output prefix-free, so the
            # match is purely structural. `sed` strips any stray ANSI
            # escapes that slipped past NO_COLOR (belt and suspenders).
            if grep -qE '=== .+ ===' bench-scenarios.log 2>/dev/null; then
              awk '
                /=== .+ ===/    { printing=1 }
                printing        { print }
                /└/ && printing { printing=0; print "" }
              ' bench-scenarios.log \
              | sed -E $'s/\x1b\\[[0-9;]*m//g'
            else
              tail -n 80 bench-scenarios.log
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
