name: Mutation

# Mutation testing (StrykerJS) — issue #1028.
#
# WARNING, not a PR gate (issue #1056): this workflow never runs on
# pull_request, so it can NEVER block a PR or merge. The per-package Stryker
# configs set a `thresholds.break` floor (libs/*/stryker.conf.mjs, ~6 pts
# under the CI baseline); a real mutation-score regression makes the run go
# red (a visible signal in the Actions tab), instead of vanishing into a
# green check.
#
# Mutation runs are slow (a full pass mutates every source file and re-runs
# the suite per mutant), which is why this is off the per-PR hot path.
#
# The weekly schedule is currently OFF, and `workflow_dispatch` is the only
# trigger. Vitest 5 matches `testNamePattern` against the suite chain joined
# with ' > '; @stryker-mutator/vitest-runner still joins with ' ', so the
# per-test filter that `coverageAnalysis: "perTest"` depends on matches
# nothing and EVERY covered mutant is reported Survived. Measured on
# act-patch: the dry run passes 101 tests, then 105 of 105 mutants survive
# for a score of 0.00 against a break floor of 73. A weekly run that is red
# for a reason unrelated to test quality trains everyone to ignore the badge,
# which costs more than the missing signal.
#
# Upstream: stryker-mutator/stryker-js#6210, with fixes open but unreleased
# in #6214 and #6220. Restore the `schedule:` block below once a
# vitest-runner carrying either fix ships, and confirm against the recorded
# baselines in libs/*/stryker.conf.mjs before trusting a score again.

permissions:
  contents: read

on:
  workflow_dispatch:
  # Re-enable once the vitest 5 test-name-separator fix ships upstream
  # (see the header note). Weekly, Monday 06:00 UTC.
  # schedule:
  #   - cron: "0 6 * * 1"

jobs:
  mutation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            act,
            act-pg,
            act-sqlite,
            act-tck,
            act-http,
            act-crypto,
            act-patch,
            act-ops,
          ]
    services:
      # Always provisioned; only @rotorsoft/act-pg's specs connect to it
      # (port 5431, mirroring the unit-test CI job in ci-cd.yml).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5431:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: "pnpm"

      - run: pnpm install

      - name: Run mutation testing (${{ matrix.package }})
        run: pnpm --filter @rotorsoft/${{ matrix.package }} run mutation

      # Compute the mutation score from Stryker's JSON report and append it
      # to the run summary. Score = (Killed + Timeout) / (Killed + Timeout +
      # Survived + NoCoverage) — the standard StrykerJS mutation score.
      - name: Publish mutation score (${{ matrix.package }})
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const pkg = "${{ matrix.package }}";
            const f = `libs/${pkg}/reports/mutation/mutation.json`;
            const out = process.env.GITHUB_STEP_SUMMARY;
            if (!fs.existsSync(f)) {
              fs.appendFileSync(out, `## Mutation — ${pkg}\n\nNo report produced.\n\n`);
              process.exit(0);
            }
            const report = JSON.parse(fs.readFileSync(f, "utf8"));
            const counts = {};
            for (const file of Object.values(report.files ?? {})) {
              for (const m of file.mutants ?? []) {
                counts[m.status] = (counts[m.status] ?? 0) + 1;
              }
            }
            const detected = (counts.Killed ?? 0) + (counts.Timeout ?? 0);
            const undetected = (counts.Survived ?? 0) + (counts.NoCoverage ?? 0);
            const valid = detected + undetected;
            const score = valid ? ((detected / valid) * 100).toFixed(2) : "n/a";
            const md = [
              `## Mutation — ${pkg}`,
              "",
              `**Mutation score: ${score}%** (non-blocking baseline)`,
              "",
              "| Status | Count |",
              "|---|---:|",
              ...Object.entries(counts).map(([k, v]) => `| ${k} | ${v} |`),
              "",
            ].join("\n");
            fs.appendFileSync(out, md + "\n");
          '

      - name: Upload mutation report (${{ matrix.package }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.package }}
          path: libs/${{ matrix.package }}/reports/mutation/
          if-no-files-found: ignore
