name: CI-CD

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  # The `changes` job is the only path filter: it decides what runs.
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

env:
  SKIP_SIMPLE_GIT_HOOKS: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # `src-changed` gates `ci`; `libs` picks the CD matrix (semantic-release
  # still decides whether each package releases).
  changes:
    runs-on: ubuntu-latest
    outputs:
      src-changed: ${{ steps.src.outputs.src }}
      libs: ${{ steps.libs.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: src
        with:
          filters: |
            src:
              # Every file typecheck or lint reads, wherever it lives, so a change
              # to one never skips the checks that cover it.
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.json'
              - '**/*.js'
              - '**/*.mjs'
              - 'libs/*/src/**'
              - 'libs/*/test/**'
              - 'test/**'
              - 'packages/**'
              - 'recipes/**'
              - 'docs/docs/architecture/behavior-contracts.md'
              - 'scripts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci-cd.yml'
      - uses: dorny/paths-filter@v4
        id: libs
        with:
          filters: |
            act-patch:   ['libs/act-patch/**']
            act:         ['libs/act/**']
            act-http:    ['libs/act-http/**']
            act-pg:      ['libs/act-pg/**']
            act-sqlite:  ['libs/act-sqlite/**']
            act-pino:    ['libs/act-pino/**']
            act-otel:    ['libs/act-otel/**']
            act-notify:  ['libs/act-notify/**']
            act-ops:     ['libs/act-ops/**']
            act-crypto:  ['libs/act-crypto/**']
            act-diagram: ['libs/act-diagram/**']
            act-tck:     ['libs/act-tck/**']

  ci:
    needs: changes
    if: needs.changes.outputs.src-changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5431:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: "pnpm"

      - run: pnpm install
      # The pre-commit hook checks only staged files; this checks them all.
      - run: pnpm lint
      # Subpath `exports` and tsconfig.workspace.json paths must match (`pnpm paths:sync`).
      - run: pnpm paths:check
      # Every test the behavior-contracts page cites must exist by its exact name.
      - run: pnpm check:contracts
      # Every ```ts block in docs/docs must compile; the self-test proves a broken one fails.
      - run: pnpm -F docs check:snippets
      - run: pnpm -F docs check:snippets:selftest
      - run: pnpm typecheck
      # typecheck resolves to src, so build to cover declaration emit and tsup.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check:stability

      # A browser-imported subpath (`act-http/sse`) must not reach a Node API.
      # Walks dist/, so it runs after build.
      - run: pnpm check:browser-safe

      # Every lib README has the canonical sections (opt out: `canonical-check: deprecated`).
      - run: pnpm check:readmes

      # `act` CLI smoke test on both examples. NO_COLOR keeps the output greppable.
      - name: act-cli smoke (calculator)
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          pnpm act packages/calculator -q Incremented | tee act-cli-calculator.log
          grep -q "^Incremented$" act-cli-calculator.log
          grep -q "status:" act-cli-calculator.log
      - name: act-cli smoke (wolfdesk)
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          pnpm act packages/wolfdesk -q TicketOpened | tee act-cli-wolfdesk.log
          grep -q "^TicketOpened$" act-cli-wolfdesk.log
          grep -q "status:" act-cli-wolfdesk.log
      # Run the BUILT bin through its shebang, the way `npx act` does.
      - name: act-cli smoke (built bin)
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          ./libs/act-diagram/dist/cli/act.js packages/calculator -q Incremented | tee act-cli-dist.log
          grep -q "^Incremented$" act-cli-dist.log

      # Best-effort: a Coveralls outage must not block a release.
      - uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  cd:
    # On master when a lib changed, even if `ci` skipped (`always()`):
    # semantic-release decides whether to release.
    if: |
      always() &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.libs != '[]' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    needs: [changes, ci]
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's, so restate them.
    # `id-token: write` lets npm attest provenance.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    strategy:
      max-parallel: 1 # prevents concurrent pull/push conflicts on main branch
      fail-fast: false
      matrix:
        lib: ${{ fromJson(needs.changes.outputs.libs) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install

      # Build from source: upload-artifact strips the `libs/` prefix and
      # would publish a package with no dist/.
      - run: pnpm build

      - name: configure git
        run: |
          git config user.name "rotorsoft"
          git config user.email "rotorsoft@outlook.com"

      - name: pull latest master
        run: git pull origin master --rebase

      # npm trusted publishing: the job's OIDC identity is traded for a
      # short-lived token. No NPM_TOKEN (setup: contributing-new-package.md).
      - name: release ${{ matrix.lib }}
        working-directory: libs/${{ matrix.lib }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit, so it survives a change of publish path.
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release
