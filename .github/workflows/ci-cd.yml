name: CI-CD

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  # Every PR and master push starts the workflow; the `changes` job below is
  # the only path filter, so it decides what runs.
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

env:
  SKIP_SIMPLE_GIT_HOOKS: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # One paths-filter pass produces two signals:
  #   - `src-changed`: anything that can change typecheck/build/test results
  #     → run `ci`. Pure docs/CHANGELOG/PERFORMANCE updates
  #     inside a lib don't trip this; dependency, lockfile, test and
  #     toolchain changes do.
  #   - `libs`: which lib directories changed at all → CD matrix entries.
  #     semantic-release still has the final say (a `docs:` commit produces
  #     no release), so this is just an upper bound on which jobs to spin up.
  changes:
    runs-on: ubuntu-latest
    outputs:
      src-changed: ${{ steps.src.outputs.src }}
      libs: ${{ steps.libs.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: src
        with:
          filters: |
            src:
              # Every file `pnpm typecheck` or `pnpm lint` reads, wherever it
              # lives (bench/, scripts/, docs config, root configs), so a
              # change to one never skips the checks that cover it. This only
              # type-checks and lints bench files: every benchmark, the adapter
              # perf gate included, runs on the weekly schedule
              # (conformance.yml). The globs also match every root and package
              # config (package.json, tsconfig*.json, biome.json,
              # vite.config.ts, tsup.config.ts).
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.json'
              - '**/*.js'
              - '**/*.mjs'
              - 'libs/*/src/**'
              - 'libs/*/test/**'
              - 'test/**'
              - 'packages/**'
              - 'recipes/**'
              - 'docs/docs/architecture/behavior-contracts.md'
              - 'scripts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci-cd.yml'
      - uses: dorny/paths-filter@v4
        id: libs
        with:
          filters: |
            act-patch:   ['libs/act-patch/**']
            act:         ['libs/act/**']
            act-http:    ['libs/act-http/**']
            act-pg:      ['libs/act-pg/**']
            act-sqlite:  ['libs/act-sqlite/**']
            act-pino:    ['libs/act-pino/**']
            act-otel:    ['libs/act-otel/**']
            act-notify:  ['libs/act-notify/**']
            act-ops:     ['libs/act-ops/**']
            act-crypto:  ['libs/act-crypto/**']
            act-diagram: ['libs/act-diagram/**']
            act-tck:     ['libs/act-tck/**']

  ci:
    needs: changes
    if: needs.changes.outputs.src-changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5431:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: "pnpm"

      - run: pnpm install
      # Biome lint + format check over the whole repo. The pre-commit hook
      # only checks staged files, so this is the one place it all runs.
      - run: pnpm lint
      # Fail fast if a package added/removed/renamed a subpath `export`
      # without regenerating the workspace `paths` map.
      # `pnpm paths:sync` rewrites tsconfig.workspace.json from the
      # `exports` fields; this check enforces they stay in lockstep.
      - run: pnpm paths:check
      # Every test the behavior-contracts page cites must exist by its exact
      # name, so renaming a test means updating the row that cites it.
      - run: pnpm check:contracts
      # Every fenced ```ts block in docs/docs must compile against the live
      # source, so an API change that breaks a shown snippet fails here. The
      # self-test plants a broken snippet and proves the check rejects it.
      - run: pnpm -F docs check:snippets
      - run: pnpm -F docs check:snippets:selftest
      - run: pnpm typecheck
      # `pnpm typecheck` no longer builds first (it resolves cross-package
      # imports to `src` via tsconfig.workspace.json), so build explicitly to
      # keep declaration-emit / tsup coverage on PRs.
      - run: pnpm build
      - run: pnpm test
      # Reads the declarations the build just wrote.
      - run: pnpm check:stability

      # Browser-safety gate. A published subpath that client code imports
      # (`@rotorsoft/act-http/sse`) must not statically reach a Node API: one
      # framework import puts its module-scope AsyncLocalStorage into every
      # browser bundle, and nothing else here builds one. Walks `dist/`, so
      # it runs after build.
      - run: pnpm check:browser-safe

      # Section-presence check for libs/*/README.md.
      # Fails the build if any lib README is missing one of the required
      # canonical sections (Title + tagline, Why, Installation, Quick start,
      # Related, Documentation, License). Deprecated packages opt out via
      # the `canonical-check: deprecated` HTML-comment marker.
      - run: pnpm check:readmes

      # `act` CLI smoke test — non-interactive `-q` query against both
      # example apps. Catches regressions in the parser, builder, or
      # formatter that would silently break the doc surface. NO_COLOR
      # neutralises picocolors so greps can match the plain detail view.
      - name: act-cli smoke (calculator)
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          pnpm act packages/calculator -q Incremented | tee act-cli-calculator.log
          grep -q "^Incremented$" act-cli-calculator.log
          grep -q "status:" act-cli-calculator.log
      - name: act-cli smoke (wolfdesk)
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          pnpm act packages/wolfdesk -q TicketOpened | tee act-cli-wolfdesk.log
          grep -q "^TicketOpened$" act-cli-wolfdesk.log
          grep -q "status:" act-cli-wolfdesk.log
      # The steps above run the CLI from source through tsx. Consumers get the
      # BUILT bin, so run that too, executed directly through its shebang the
      # way `npx act` does: only the artifact shows a broken shebang.
      - name: act-cli smoke (built bin)
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          ./libs/act-diagram/dist/cli/act.js packages/calculator -q Incremented | tee act-cli-dist.log
          grep -q "^Incremented$" act-cli-dist.log

      # Coveralls upload is best-effort: a coveralls outage must not block a
      # release.
      - uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  cd:
    # Run on master when at least one lib directory changed, regardless of
    # whether CI ran. `ci` skips on pure docs/CHANGELOG updates inside libs
    # — semantic-release-monorepo decides on its own whether a release is
    # warranted, so a skipped CI still gets us a clean no-op CD when the
    # commit type isn't releasable. `always()` is required because `needs:`
    # by default treats a skipped upstream as a block.
    if: |
      always() &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.libs != '[]' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    needs: [changes, ci]
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow-level block, so the existing
    # grants are restated here alongside the new one. `id-token: write` lets
    # npm mint a Sigstore provenance attestation on publish —
    # the OIDC token proves the package was built by this workflow run.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    strategy:
      max-parallel: 1 # prevents concurrent pull/push conflicts on main branch
      fail-fast: false
      matrix:
        lib: ${{ fromJson(needs.changes.outputs.libs) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install

      # Build from source rather than downloading CI's `dist` artifact:
      # `actions/upload-artifact` strips the common `libs/` prefix, which
      # publishes a package with no `dist/`. ~30s per matrix job; `pnpm -r
      # build` respects topological order.
      - run: pnpm build

      - name: configure git
        run: |
          git config user.name "rotorsoft"
          git config user.email "rotorsoft@outlook.com"

      - name: pull latest master
        run: git pull origin master --rebase

      # Publishes with npm TRUSTED PUBLISHING — no long-lived token. pnpm
      # exchanges the job's OIDC identity (the `id-token: write` permission
      # above) for a short-lived npm token scoped to the package being
      # published, which npm grants only to the repo + workflow filename
      # registered as that package's Trusted Publisher on npmjs.com. A
      # publish from anywhere else has no identity to trade.
      #
      # There is no `NPM_TOKEN`: pnpm attempts the OIDC exchange whether or
      # not a static token is present, so the Trusted Publisher registration
      # is what enables it, and a token would only add a credential that can
      # leak (setup for a new package: contributing-new-package.md).
      - name: release ${{ matrix.lib }}
        working-directory: libs/${{ matrix.lib }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Provenance attestation. Trusted publishing turns
          # this on by default; kept explicit so the intent survives a change
          # of publish path, and because `pnpm publish` delegates to the npm
          # CLI, which reads NPM_CONFIG_* from the environment.
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release
