name: Docs Build

# Builds the Docusaurus site (typedoc + docusaurus build) on docs PRs,
# so MDX parse errors, broken JSX, and fatal build/config failures can't
# merge (issue #1075). docs-only PRs otherwise run no build at all — the
# main ci-cd workflow triggers on `libs/**`. This type-checks the fenced
# snippets and catches everything else the build validates (MDX/JSX,
# sidebars, config). Broken links are currently
# `onBrokenLinks: warn` so they don't fail here; flip that to `throw`
# once the known offenders are cleared to gate links too.
on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'
  # No master push trigger: deploy-docs.yml builds the same site on master.
  workflow_dispatch:

permissions:
  contents: read

env:
  SKIP_SIMPLE_GIT_HOOKS: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: "pnpm"
      - run: pnpm install
      # Snippets before the build: build:all writes docs/docs/api, which the
      # snippet check skips anyway.
      - run: pnpm -F docs check:snippets
      - run: pnpm -F docs check:snippets:selftest
      - run: pnpm -F docs build:all
