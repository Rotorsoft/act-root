name: Docs Build

# Builds the Docusaurus site (typedoc + docusaurus build) on docs PRs, so
# MDX, JSX, sidebar and config errors can't merge. Broken links only warn.
on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'
  # No master push trigger: deploy-docs.yml builds the same site on master.
  workflow_dispatch:

permissions:
  contents: read

env:
  SKIP_SIMPLE_GIT_HOOKS: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: "pnpm"
      - run: pnpm install
      # Snippets before the build: build:all writes docs/docs/api, which the
      # snippet check skips anyway.
      - run: pnpm -F docs check:snippets
      - run: pnpm -F docs check:snippets:selftest
      - run: pnpm -F docs build:all
