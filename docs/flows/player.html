<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one screen. Top bar (title, scenarios, transport); the flow map fills the left and fits,
   with captions over its foot; the right rail stacks event stream, live state and how-to-read panels,
   each scrolling on its own. Legend and node details float above and close. */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --raised: #ffffff; --ink: #151922; --muted: #5d6574; --line: #dde1e8; --edge: #b9c0cc;
  --actor: #4f5d75; --action: #2b5fd0; --state: #a87d00; --event: #d96a14; --projection: #17875c; --reaction: #7f4cc7; --external: #c8336f;
  --bad: #c62828; --good: #17875c; --focus: #2b5fd0; --shadow: 0 10px 30px rgba(20, 25, 40, .14);
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1015; --surface: #141920; --raised: #1a2029; --ink: #e8ebf1; --muted: #99a2b3; --line: #262d39; --edge: #465061;
  --actor: #aab6cc; --action: #6e9cff; --state: #e9b931; --event: #ff9548; --projection: #3ccf92; --reaction: #b38bff; --external: #ff6ca8;
  --bad: #ff6b6b; --good: #3ccf92; --focus: #6e9cff; --shadow: 0 12px 34px rgba(0, 0, 0, .5); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d1015; --surface: #141920; --raised: #1a2029; --ink: #e8ebf1; --muted: #99a2b3; --line: #262d39; --edge: #465061;
  --actor: #aab6cc; --action: #6e9cff; --state: #e9b931; --event: #ff9548; --projection: #3ccf92; --reaction: #b38bff; --external: #ff6ca8;
  --bad: #ff6b6b; --good: #3ccf92; --focus: #6e9cff; --shadow: 0 12px 34px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); overflow: hidden; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { min-width: 0; flex: 1 1 260px; }
h1 { font: 600 19px/1.2 var(--f-display); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { color: var(--muted); font-size: 12.5px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; flex-wrap: wrap; gap: 3px; padding: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 500 12.5px var(--f-body); padding: 5px 10px; border-radius: 7px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.ctl { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.ctl button, .ctl select { height: 30px; min-width: 32px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; font: 500 12.5px var(--f-body); cursor: pointer; padding: 0 9px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.ctl button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 74px; }
.ctl button[aria-pressed="true"] { background: color-mix(in srgb, var(--action) 14%, var(--surface)); }
.ctl .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.ctl svg { width: 14px; height: 14px; }
.rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
.recording .rec-dot { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
button:focus-visible, select:focus-visible, .node:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 24vw, 400px); min-height: 0; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
/* a map wider than the stage scrolls sideways at a readable scale; the caption stays put */
.scroller { position: absolute; inset: 0 0 76px 0; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; }
.scroller > svg { display: block; width: 100%; height: 100%; }
.caption { position: absolute; left: 16px; right: 16px; bottom: 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow); }
.caption .count { font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.caption .say { font-size: 15px; min-width: 0; }
.caption .say b { font-weight: 600; }
.caption code, .side code { font-family: var(--f-mono); font-size: .92em; }
.chip { font: 500 12px var(--f-mono); padding: 3px 9px; border-radius: 99px; white-space: nowrap; background: color-mix(in srgb, var(--k, var(--muted)) 14%, var(--surface)); color: var(--k, var(--muted)); }
.progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; grid-column: 1 / -1; }
.progress div { height: 100%; width: 0; background: var(--ink); transition: width .3s; }

.side { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.panel { display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--line); }
.panel.grow { flex: 1 1 0; }
.panel.grow.closed { flex: 0 0 auto; }
.panel > button.ph { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 10px 16px; font: 600 11.5px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.panel > button.ph:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.panel > button.ph .meta { margin-left: auto; text-transform: none; letter-spacing: 0; font: 500 11.5px var(--f-mono); }
.panel > button.ph .caret { transition: transform .2s; font-size: 10px; }
.panel.closed > button.ph .caret { transform: rotate(-90deg); }
.panel .pb { overflow: auto; min-height: 0; padding: 0 16px 12px; }
.panel.closed .pb { display: none; }
.log { list-style: none; margin: 0; padding: 0; font: 12px/1.4 var(--f-mono); }
.log li { display: grid; grid-template-columns: 2.6em minmax(0, 1fr); gap: 1px 10px; padding: 6px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.log li:first-child { border-top: 0; }
.log li.new { animation: flash 1.2s ease-out; }
.log .id { color: var(--muted); text-align: right; }
.log .nm { color: var(--event); font-weight: 500; overflow-wrap: anywhere; }
.log li.rej .nm, .log li.blk .nm { color: var(--bad); }
.log .st, .log .dt { grid-column: 2; color: var(--muted); overflow-wrap: anywhere; }
.log .dt { font-size: 11.5px; }
.log .mt { grid-column: 2; font-size: 11px; color: var(--muted); opacity: .85; overflow-wrap: anywhere; }
.log li.tx { display: block; padding: 7px 0 2px; color: var(--muted); font: 600 10.5px var(--f-body); text-transform: uppercase; letter-spacing: .07em; }
.log li.tx b { color: var(--ink); font-weight: 600; }
.log li.in { border-left: 2px solid color-mix(in srgb, var(--event) 45%, transparent); padding-left: 8px; border-top-color: transparent; }
.txb path { fill: none; stroke: var(--event); stroke-width: 1.6; }
.txb rect { fill: var(--surface); stroke: var(--event); stroke-width: 1.2; }
.txb text { font: 600 10.5px var(--f-mono); fill: var(--event); }
.txb { animation: pop .25s ease-out; }
.log .by { display: inline-flex; align-items: center; gap: 4px; }
.log .by svg { width: 12px; height: 12px; flex: none; }
.empty { display: block; color: var(--muted); font: 13px var(--f-body); }
@keyframes flash { from { background: color-mix(in srgb, var(--event) 18%, transparent); } to { background: transparent; } }
.state { margin: 0; display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 0 12px; font: 12px/1.45 var(--f-mono); }
.state dt { color: var(--muted); padding: 3px 0; border-top: 1px solid var(--line); }
.state dd { margin: 0; padding: 3px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.state dt:first-of-type, .state dd:first-of-type { border-top: 0; }
.state .chg { animation: chg 1.6s ease-out; }
.state dd.chg { color: var(--state); font-weight: 500; }
@keyframes chg { from { background: color-mix(in srgb, var(--state) 22%, transparent); } to { background: transparent; } }
.other { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--line); }
.other .oh { font: 600 10.5px var(--f-mono); color: var(--state); margin-bottom: 4px; overflow-wrap: anywhere; }
.read { margin-top: 12px; border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); padding-top: 8px; }
.read summary { cursor: pointer; font: 600 11.5px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 2px 0 6px; }
.read p { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; }

/* floating windows */
.win { position: absolute; z-index: 5; width: 320px; max-width: calc(100% - 24px); max-height: calc(100% - 110px); display: flex; flex-direction: column; background: color-mix(in srgb, var(--raised) 78%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.win header { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; cursor: grab; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); user-select: none; touch-action: none; }
.win header h2 { margin: 0; font: 600 11.5px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); flex: 1; }
.win header button { border: 0; background: transparent; color: var(--muted); width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 16px; line-height: 1; }
.win header button:hover { background: var(--bg); color: var(--ink); }
.win .wb { padding: 10px 14px 12px; overflow: auto; min-height: 0; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 12px; }
#legend-win { width: 380px; }
.legend div { display: flex; align-items: center; gap: 9px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.legend svg { width: 14px; height: 14px; flex: none; }
.legend .mono { font-family: var(--f-mono); width: 14px; text-align: center; flex: none; }
.legend i.bx { background: transparent; border: 1.5px dashed var(--k); }
.ico { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.detail h3 { font: 600 17px var(--f-display); margin: 0 0 2px; overflow-wrap: anywhere; }
.detail .kind { font: 600 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; }
.detail p { margin: 8px 0; color: var(--muted); font-size: 13px; }
.detail ul { margin: 6px 0; padding-left: 18px; font-size: 13px; }
.detail pre { font: 11.5px/1.45 var(--f-mono); background: var(--bg); border-radius: 8px; padding: 8px 10px; overflow-x: auto; margin: 8px 0; white-space: pre-wrap; }
.detail .rel { font-size: 13px; }
.detail .rel button { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-decoration-color: var(--edge); cursor: pointer; font: inherit; }
.detail .file { font: 11.5px var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
.toast { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); z-index: 9; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 13px; max-width: min(560px, 90%); box-shadow: var(--shadow); }

/* svg */
.lane-bg { fill: var(--surface); opacity: .6; }
.lane-sep { stroke: var(--line); }
.lane-label { font: 600 11px var(--f-body); letter-spacing: .09em; text-transform: uppercase; fill: var(--muted); }
.lane-sub { font: 11px var(--f-mono); fill: var(--muted); opacity: .8; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.4; transition: stroke .3s, opacity .3s, stroke-width .3s; }
.edge.dash { stroke-dasharray: 4 4; }
.arrow { fill: var(--edge); transition: fill .3s, opacity .3s; }
.eg.trail .edge { stroke: var(--k); stroke-width: 2; opacity: .55; }
.eg.trail .arrow { fill: var(--k); opacity: .55; }
.eg.live .edge { stroke: var(--k); stroke-width: 2.6; opacity: 1; }
.eg.live .arrow { fill: var(--k); opacity: 1; }
.dim .eg:not(.hl):not(.trail):not(.live) { opacity: .18; }
.dim .node:not(.hl) { opacity: .35; }
.eg.hl .edge { stroke: var(--k); stroke-width: 2.2; }
.eg.hl .arrow { fill: var(--k); }
.node { cursor: pointer; transition: opacity .3s; }
.node rect.box { fill: color-mix(in srgb, var(--k) 11%, var(--surface)); stroke: var(--k); stroke-width: 1.3; transition: fill .3s, stroke-width .3s, stroke .3s; }
.node.auto rect.box { stroke-dasharray: 5 3; }
.node.on rect.box { fill: color-mix(in srgb, var(--k) 24%, var(--surface)); stroke-width: 2.2; }
.node.sel rect.box { stroke-width: 2.6; }
.node.blocked rect.box { stroke: var(--bad); stroke-width: 2.4; fill: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.node.bad rect.box { stroke: var(--bad); }
.node text { font: 600 12.5px var(--f-display); fill: var(--ink); pointer-events: none; }
.node .tag { font: 600 8.5px var(--f-body); letter-spacing: .1em; fill: var(--k); text-transform: uppercase; }
.node .badge { font: 500 10px var(--f-mono); fill: var(--k); }
.node .as { font: 500 9.5px var(--f-mono); fill: var(--muted); }
.node .glyph { fill: none; stroke: var(--k); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.node .pulse { fill: none; stroke: var(--k); opacity: 0; }
.node.ping .pulse { animation: ping .9s ease-out; }
@keyframes ping { 0% { opacity: .9; stroke-width: 6; } 100% { opacity: 0; stroke-width: 18; } }
.token { fill: var(--k); stroke: var(--surface); stroke-width: 2; }
.token-halo { fill: var(--k); opacity: .25; }
.timer circle.face { fill: var(--surface); stroke: var(--k); stroke-width: 1.6; }
.timer line { stroke: var(--k); stroke-width: 1.6; stroke-linecap: round; }
.timer .hand { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.verdict rect { fill: var(--surface); stroke: var(--k); stroke-width: 1.4; }
.verdict text { font: 600 11px var(--f-mono); fill: var(--k); }
.verdict { animation: pop .25s ease-out; }
.checks rect.card { fill: var(--surface); stroke: var(--state); stroke-width: 1.4; }
.checks text { font: 500 12.5px var(--f-mono); }
.checks .row { animation: pop .25s ease-out; }
.checks .pre, .node .badge .pre, .legend .pre, .read .pre, .detail .pre { fill: var(--action); color: var(--action); }
.checks .emit { fill: var(--muted); }
.checks .mark { fill: var(--muted); }
.checks .row.pass .mark { fill: var(--good); }
.checks .row.fail .mark { fill: var(--bad); }
.checks .row.fail .lbl { font-weight: 600; }
@keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.tick { fill: var(--k); }
.tick.on { animation: tickon .8s ease-out; }
@keyframes tickon { 0% { r: 7; } 100% { r: 3.2; } }
/* boundaries the builders declare: one box per state, one per slice */
.band rect.frame { fill: color-mix(in srgb, var(--k) 4%, transparent); stroke: color-mix(in srgb, var(--k) 50%, transparent); stroke-width: 1.2; stroke-dasharray: 6 4; transition: fill .3s, stroke .3s, stroke-width .3s; }
.band.on rect.frame { fill: color-mix(in srgb, var(--k) 10%, transparent); stroke: var(--k); stroke-width: 1.8; stroke-dasharray: none; }
.band.sel rect.frame { stroke: var(--k); stroke-width: 2.2; }
.band text { font: 600 10.5px var(--f-mono); fill: var(--k); cursor: pointer; }
.band text tspan.bk { font-weight: 400; fill: var(--muted); }
.band .pulse { fill: none; stroke: var(--k); opacity: 0; }
.band.ping .pulse { animation: ping .9s ease-out; }
.dim .band { opacity: .5; }
.eg.cross .edge { stroke-width: 1.9; }
.ring { fill: none; stroke: var(--k); stroke-width: 2.5; animation: ring .9s ease-out forwards; }
@keyframes ring { 0% { r: 4; opacity: 1; } 100% { r: 22; opacity: 0; } }

/* modes: #record hides interactive chrome, #embed trims for an iframe */
.record .ctl, .record .win, .embed .brand, .embed .ctl .opt { display: none !important; }
@media (min-width: 901px) { .embed .main { grid-template-columns: minmax(0, 1fr) clamp(260px, 26vw, 330px); } }

@media (max-width: 900px) {
  body { overflow: auto; padding-bottom: 96px; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .top { padding: 10px 12px; }
  .tabs { flex: 1 1 100%; min-width: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: none; white-space: nowrap; }
  #rec-btn, .ctl .sep { display: none; }
  .stage { height: calc(100svh - 120px); min-height: 420px; }
  .scroller { bottom: 88px; }
  .caption { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 6; grid-template-columns: auto minmax(0, 1fr); }
  .caption .chip { display: none; }
  .caption .say { font-size: 14px; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .panel.grow { flex: none; }
  .panel .pb { max-height: 50vh; }
  .win { position: fixed; }
}
@media (prefers-reduced-motion: reduce) { .node.ping .pulse, .band.ping .pulse, .ring, .timer .hand, .log li.new, .tick.on, .verdict, .checks .row, .state .chg, .recording .rec-dot { animation: none; } }
</style>

<div class="app" id="app">
  <div class="top">
    <div class="brand">
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="ctl">
      <button id="restart" title="Restart scenario" aria-label="Restart scenario">⟲</button>
      <button id="back" title="Previous step (←)" aria-label="Previous step">‹</button>
      <button id="play" class="primary" title="Play or pause (space)">Play</button>
      <button id="fwd" title="Next step (→)" aria-label="Next step">›</button>
      <select id="speed" aria-label="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.6">1.6×</option><option value="2.5">2.5×</option></select>
      <span class="sep opt"></span>
      <button id="legend-btn" class="opt" aria-pressed="true" title="Show or hide the legend and how to read">Legend</button>
      <button id="theme-btn" class="opt" title="Switch light or dark" aria-label="Switch light or dark"><svg viewBox="0 0 16 16" class="ico"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11A5.5 5.5 0 0 0 8 2.5z" fill="currentColor"/></svg></button>
      <button id="rec-btn" class="opt" title="Record this scenario as a video of the tab"><span class="rec-dot"></span>Record</button>
    </div>
  </div>

  <div class="main">
    <section class="stage" id="stage">
      <div class="scroller" id="scroller"><svg id="svg" role="img" aria-label="Flow map" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="caption" aria-live="polite">
        <span class="count" id="count"></span>
        <span class="say" id="say"></span>
        <span class="chip" id="chip" hidden></span>
        <div class="progress"><div id="prog"></div></div>
      </div>
      <div class="win" id="legend-win" style="right:16px;bottom:92px">
        <header><h2>Legend</h2><button data-close aria-label="Close legend">×</button></header>
        <div class="wb">
          <div class="legend" id="legend"></div>
          <details class="read" id="read-box" open>
            <summary>How to read</summary>
            <div id="read"></div>
          </details>
        </div>
      </div>
      <div class="win detail" id="node-win" hidden style="right:16px;top:16px">
        <header><h2>Selected</h2><button data-close aria-label="Close details">×</button></header>
        <div class="wb" id="detail"></div>
      </div>
      <div class="toast" id="toast" hidden role="status"></div>
    </section>

    <aside class="side">
      <section class="panel grow" id="p-log">
        <button class="ph" aria-expanded="true"><span class="caret">▼</span>Event stream<span class="meta" id="log-meta"></span></button>
        <div class="pb"><ol class="log" id="log"></ol></div>
      </section>
      <section class="panel grow" id="p-state">
        <button class="ph" aria-expanded="true"><span class="caret">▼</span><span id="state-h">State</span><span class="meta" id="state-meta"></span></button>
        <div class="pb" id="state"></div>
      </section>
    </aside>
  </div>
</div>

<script type="application/json" id="flow">__FLOW_JSON__</script>
<script>
(() => {
  const spec = JSON.parse(document.getElementById("flow").textContent);
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const modes = new Set(location.hash.slice(1).split("-").filter(Boolean));

    const RH = 22, w = Math.max(...rows.map(r => r.t.length)) * 7.5 + 58, h = rows.length * RH + 10;
    const left = x + 14 + w > svg.viewBox.baseVal.width ? x - 14 - w : x + 14;
    const g = el("g", { class: "checks" }, gFx);
    el("rect", { x: left, y: y - h / 2, width: w, height: h, rx: 9, class: "card" }, g);
    let ok = true;
    for (let i = 0; i < rows.length && ok; i++) {
      const r = el("g", { class: "row" }, g);
      const t = el("text", { x: left + 11, y: y - h / 2 + 5 + RH * i + 15 }, r);
      const mark = el("tspan", { class: "mark" }, t); mark.textContent = "○ ";
      const icon = el("tspan", { class: rows[i].k }, t); icon.textContent = ICON[rows[i].k] + " ";
      const lbl = el("tspan", { class: `lbl ${rows[i].k}` }, t); lbl.textContent = rows[i].t;
      if (!(ok = await wait(380, token))) break;
      r.classList.add(i === fail ? "fail" : "pass");
      mark.textContent = i === fail ? "✕ " : "✓ ";
      if (i === fail) break;
      ok = await wait(220, token);
    }
    if (ok) ok = await wait(reject ? 1500 : 500, token);
    g.remove();
    return ok;
  }
  function timer(n) {
    const g = el("g", { class: "timer", style: `--k:var(--reaction)` }, gFx);
    const x = n.right + 2, y = n.top - 2;
    el("circle", { cx: x, cy: y, r: 10, class: "face" }, g);
    el("line", { x1: x, y1: y, x2: x, y2: y - 6.5, class: "hand", style: `transform-origin:${x}px ${y}px` }, g);
    el("line", { x1: x, y1: y, x2: x + 4, y2: y }, g);
    return g;
  }
  // a recorded video holds each caption long enough to read (about 20 characters a second); the live
  // player keeps a brisk pace, since a viewer can pause or step
  const readTime = st => {
    const len = (st.say || "").replace(/\*\*|`/g, "").length;
    if (RECORD) return 1200 + len * 50;
    return reduce ? 1600 : 700 + Math.min(1600, len * 16);
  };

  async function doStep(token) {
    const sc = scenarios[cur], st = sc.steps[step];
    setNarr(step + 1);
    if (st.at) {
      const n = nodes.get(st.at);
      if (st.wait) { const t = timer(n); const ok = await wait(1500, token); t.remove(); if (!ok) return false; }
      ping(n);
      const v = st.noop ? verdict(n.right - 10, n.top - 14, "no-op", "var(--muted)") : null;
      step++;
      const ok = await wait(readTime(st), token);
      v?.remove();
      return ok;
    }
    const e = findEdge(st.from, st.to), from = nodes.get(st.from), to = nodes.get(st.to);
    if (st.wait) { const t = timer(from); const ok = await wait(1500, token); t.remove(); if (!ok) return false; }
    e.g.classList.add("live");
    from.g.classList.add("on");

    const bar = barAt(from.cx);
    const [g0, g1] = groupAt(sc, step);
    if (g1 - g0 > 1 && kindOf(from) === "action" && bar) {
      // one transaction: the checks run once, then every event of the commit lands together
      const group = sc.steps.slice(g0, g1).map(x => ({ st: x, e: findEdge(x.from, x.to), to: nodes.get(x.to) }));
      const f = fractionAtY(e, bar.cy);
      if (!(await travel(e, token, 0, f))) return false;
      ping(bar);
      const rules = checksOf(from);
      if (rules.length) { if (!(await checklist(from.cx, bar.cy, rules, undefined, token))) return false; }
      else { const v = verdict(from.cx, bar.cy, "✓", "var(--good)"); const ok = await wait(650, token); v.remove(); if (!ok) return false; }
      for (const x of group) x.e.g.classList.add("live");
      const done = await Promise.all(group.map(x => travel(x.e, token, fractionAtY(x.e, bar.cy), 1)));
      if (done.some(d => !d)) return false;
      for (const x of group) { x.e.g.classList.remove("live"); x.e.g.classList.add("trail"); ping(x.to); barAt(x.to.cx)?.g.classList.add("on"); }
      const brace = commitBrace(group.map(x => x.to), new Set(group.map(x => x.st.stream || sc.stream)).size);
      step = g1;
      renderPanels(step, true);
      const ok = await wait(readTime(st) + 600, token);
      brace.remove();
      return ok;
    }
    if (kindOf(from) === "action" && kindOf(to) === "event" && bar) {
      // the action passes through the state: its checks pass one by one, or one refuses
      const f = fractionAtY(e, bar.cy);
      if (!(await travel(e, token, 0, f))) return false;
      ping(bar);
      const rules = checksOf(from);
      if (rules.length || st.reject) {
        if (!(await checklist(from.cx, bar.cy, rules, st.reject, token))) return false;
      } else {
        const v = verdict(from.cx, bar.cy, "✓", "var(--good)");
        const ok = await wait(650, token);
        v.remove();
        if (!ok) return false;
      }
      if (st.reject) {
        from.g.classList.add("bad");
        e.g.classList.remove("live"); e.g.classList.add("trail");
        step++; renderPanels(step, true);
        return wait(readTime(st), token);
      }
      if (!(await travel(e, token, f, 1))) return false;
    } else if (st.retries || st.blocked) {
      // an outbound call that fails, backs off and retries; blocked when it runs out
      const n = st.retries || 0, labels = st.backoff || [];
      const attempts = st.blocked ? n + 1 : n;
      for (let i = 0; i < attempts; i++) {
        if (!(await travel(e, token, 0, 1))) return false;
        to.g.classList.add("bad");
        const last = st.blocked && i === n;
        setChip(last ? `attempt ${i + 1} failed · no retries left` : `attempt ${i + 1} failed · retry in ${labels[i] || "backoff"}`, "var(--bad)");
        const v = verdict(to.cx - 10, to.top - 12, "✕", "var(--bad)");
        if (!(await wait(700, token))) return false;
        v.remove(); to.g.classList.remove("bad");
        if (last) break;
        const t = timer(from);
        if (!(await wait(900, token))) return false;
        t.remove();
      }
      if (st.blocked) {
        e.g.classList.remove("live"); e.g.classList.add("trail");
        from.g.classList.add("blocked");
        step++; setNarr(step); renderPanels(step, true);
        return wait(readTime(st), token);
      }
      if (!(await travel(e, token, 0, 1))) return false;
      setChip(`attempt ${n + 1} succeeded`, "var(--good)");
    } else if (e.cross) {
      // the token rings where it crosses into the next box
      const f = entryFraction(e, e.cross[1]);
      if (f === null) { if (!(await travel(e, token))) return false; }
      else {
        if (!(await travel(e, token, 0, f))) return false;
        ring(e, f, e.cross[1]);
        if (!(await travel(e, token, f, 1))) return false;
      }
    } else if (!(await travel(e, token))) return false;

    e.g.classList.remove("live"); e.g.classList.add("trail");
    ping(to);
    step++;
    if (kindOf(to) === "event") {
      renderPanels(step, true);
      barAt(to.cx)?.g.classList.add("on");
      for (const x of edges.filter(x => x.a === to && kindOf(x.b) === "projection")) {
        x.g.classList.add("live");
        travel(x, token).then(() => { x.g.classList.remove("live"); x.g.classList.add("trail"); x.tick.classList.remove("on"); void x.tick.getBBox(); x.tick.classList.add("on"); });
      }
    }
    return wait(readTime(st), token);
  }
  // resolves true when the scenario plays to the end
  async function play() {
    const sc = scenarios[cur];
    if (!sc) return false;
    if (step >= sc.steps.length) { step = 0; paint(0); }
    playing = true; hover(null); $("play").textContent = "Pause";
    const token = ++run;
    while (playing && token === run && step < sc.steps.length) if (!(await doStep(token))) return false;
    if (token !== run) return false;
    playing = false; $("play").textContent = "Replay";
    return true;
  }
  function stop() { run++; playing = false; gFx.innerHTML = ""; edges.forEach(e => e.g.classList.remove("live")); $("play").textContent = "Play"; }
  const toggle = () => playing ? (stop(), paint(step)) : play();
  const forward = async () => { const sc = scenarios[cur]; if (step >= sc.steps.length) return; stop(); paint(step); await doStep(++run); };
  // stepping back lands on the start of a commit, never inside one
  const backward = () => { stop(); const sc = scenarios[cur]; step = Math.max(0, step - 1); if (step < sc.steps.length) step = groupAt(sc, step)[0]; paint(step); };
  $("play").onclick = toggle;
  $("fwd").onclick = forward;
  $("back").onclick = backward;
  $("restart").onclick = () => { stop(); step = 0; paint(0); };
  document.addEventListener("keydown", ev => {
    if (ev.target.closest?.("select, input, textarea") || RECORD) return;
    if (ev.key === " ") { ev.preventDefault(); toggle(); }
    else if (ev.key === "ArrowRight") forward();
    else if (ev.key === "ArrowLeft") backward();
    else if (ev.key === "Escape") { select(null); }
  });

  /* ---------- video: record the tab with the browser's screen capture ---------- */
  $("rec-btn").onclick = async () => {
    let stream;
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 60, displaySurface: "browser" }, audio: false, preferCurrentTab: true, selfBrowserSurface: "include" });
    } catch {
      return toast("This page can't capture itself here. Open the hosted page in Chrome, or run pnpm -F docs flows:video from the repo for an MP4.", 7000);
    }
    const type = ["video/mp4;codecs=avc1", "video/webm;codecs=vp9", "video/webm"].find(t => MediaRecorder.isTypeSupported(t));
    const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 10e6 });
    const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    const done = new Promise(r => rec.onstop = r);
    const wasLegend = legendWin.hidden;
    document.body.classList.add("recording"); select(null);
    await sleep(600);
    rec.start();
    await sleep(500);
    await load(cur, true);
    await sleep(1200);
    rec.stop(); stream.getTracks().forEach(t => t.stop());
    await done;
    document.body.classList.remove("recording"); legendWin.hidden = wasLegend;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(chunks, { type }));
    a.download = `${(spec.slug || "flow")}-${cur + 1}.${type.startsWith("video/mp4") ? "mp4" : "webm"}`;
    document.body.appendChild(a); a.click(); a.remove();
    toast("Saved " + a.download);
  };

  let resizeTimer;
  new ResizeObserver(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const box = svg.getBoundingClientRect();
      const vb = svg.viewBox.baseVal;
      if (!box.width || !vb.width) return;
      const want = Math.max(1, Math.min(1.9, stretch * (box.height / box.width) / (vb.height / vb.width)));
      const was_wide = wide !== (vb.width * minScale() > $("scroller").clientWidth);
      if (Math.abs(want - stretch) < 0.04 && !was_wide) return;
      const resume = playing;
      stop(); drawMap();
      if (scenarios.length) { paint(step); if (resume) play(); }
    }, 180);
  }).observe($("stage"));

  /* ---------- start ---------- */
  const only = [...modes].map(m => /^s(\d+)$/.exec(m)).find(Boolean);
  const first = only ? Math.min(scenarios.length - 1, Math.max(0, +only[1] - 1)) : 0;
  async function playAll(loop) {
    do {
      for (let i = only ? first : 0; i < (only ? first + 1 : scenarios.length); i++) {
        if (!(await load(i, true))) return;
        await sleep(1400);
      }
    } while (loop);
    document.documentElement.dataset.done = "1";
  }
  if (!scenarios.length) { document.querySelector(".caption").hidden = true; document.querySelector(".ctl").hidden = true; }
  else if (RECORD) { speed = +(new URLSearchParams(location.search).get("speed") || 1); load(first, false); setTimeout(() => playAll(false), 1200); }
  else if (EMBED) { load(first, false); setTimeout(() => playAll(true), 900); }
  else { load(first, false); if (!reduce) setTimeout(() => step === 0 && !playing && play(), 900); }
  window.flow = { load, play, stop, scenarios: scenarios.length };
})();
</script>
